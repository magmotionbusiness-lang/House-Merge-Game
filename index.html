<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f2a4a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Blueprint Merge" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" as="image" href="/bg/site.webp" type="image/webp" />
    <link rel="preload" as="image" href="/logo.webp" type="image/webp" />
    <title>Blueprint Merge</title>
    <!-- Splash: inline so it paints instantly, before the game code has downloaded. -->
    <style>
      html, body { margin: 0; height: 100%; background: #2f6fd0; overflow: hidden; }
      #splash {
        position: fixed; inset: 0; z-index: 100; display: grid; place-items: center;
        background: #e9b86a url('/bg/site.webp') center 22% / cover no-repeat;
        transition: opacity 0.55s ease, transform 0.55s ease;
      }
      #splash::before { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(20,60,140,0.1), rgba(15,30,60,0.55)); }
      #splash.out { opacity: 0; transform: scale(1.04); pointer-events: none; }
      .sp-inner { position: relative; display: flex; flex-direction: column; align-items: center; gap: 18px; }
      .sp-logo {
        width: 148px; height: 148px; border-radius: 34px; border: 4px solid #fff;
        box-shadow: 0 6px 0 #3d2614, 0 16px 34px rgba(0,0,0,0.45);
        animation: sp-in 0.7s cubic-bezier(0.3,1.5,0.5,1) both, sp-float 2.6s ease-in-out 0.7s infinite;
      }
      .sp-bar {
        width: 220px; height: 18px; border-radius: 10px; background: rgba(255,248,234,0.9);
        border: 3px solid #3d2614; box-shadow: 0 4px 0 #3d2614, 0 8px 18px rgba(0,0,0,0.35); overflow: hidden;
        animation: sp-in 0.6s 0.15s ease both;
      }
      .sp-fill {
        height: 100%; width: 4%; border-radius: 6px;
        background: linear-gradient(#ffd34d, #f2a100); transition: width 0.25s ease;
        background-size: 28px 100%;
      }
      .sp-text {
        font: 600 15px/1 system-ui, -apple-system, sans-serif; letter-spacing: 0.12em; text-transform: uppercase;
        color: #fff; text-shadow: 0 2px 0 #3d2614, 0 0 10px rgba(0,0,0,0.5); animation: sp-in 0.6s 0.25s ease both;
      }
      @keyframes sp-in { from { opacity: 0; transform: translateY(14px) scale(0.92); } }
      @keyframes sp-float { 50% { transform: translateY(-8px) rotate(-2deg); } }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="bg" aria-hidden="true"></div>
      <div id="bg-tint" aria-hidden="true"></div>
      <canvas id="game"></canvas>
      <div id="hud"></div>
    </div>
    <div id="splash" role="progressbar" aria-label="Loading">
      <div class="sp-inner">
        <img class="sp-logo" src="/logo.webp" alt="Blueprint Merge" />
        <div class="sp-bar"><div class="sp-fill" id="sp-fill"></div></div>
        <div class="sp-text" id="sp-text">Laying the foundations</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
